<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="static\style.css">
</head>

<body>
    <table>
        {% if questao == '5' %}
            <thead>
                {% for chave in bd %}
                    <th>{{ chave|upper }}</th>
                {% endfor %}
            </thead>
            <tr>
                <td>{{ bd['quantidade'] }}</td>
            </tr>
        {% else %}
            <thead>
                {% for chave in bd[0] %}
                    <th>{{ chave|upper }}</th>
                {% endfor %}
            </thead>
            {% for tupla in bd %}
                <tr>
                    {% for chave in bd[0] %}
                        <td>{{ tupla[chave] }}</td>
                    {% endfor %}
                </tr>
            {% endfor %}
        {% endif %}
    </table>
</body>

</html>
