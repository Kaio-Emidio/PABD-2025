<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table>
        <thead>
            {% for chave in bd[0] %}
                <th>
                    {{ chave|upper }}
                </th>
            {% endfor %}
        </thead>
        {% for tupla in bd %}
            <tr>
                {% for chave in bd[0] %}
                    <td>
                        {{ tupla[chave] }}
                    </td>
                {% endfor %}
            </tr>
        {% endfor %}
    </table>
</body>
</html>
